{% extends "layout.html" %}

{% block title %}Practice | Flashcards{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='flashcard_style.css') }}">
<style>
    .practice-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 2rem;
    }

    .flashcard {
        width: 400px;
        height: 250px;
        perspective: 1000px;
        margin-bottom: 1rem;
    }

    .card-inner {
        width: 100%;
        height: 100%;
        position: relative;
        transition: transform 0.6s;
        transform-style: preserve-3d;
        cursor: pointer;
    }

    .flashcard.flip .card-inner {
        transform: rotateY(180deg);
    }

    .card-front,
    .card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 1px solid #ccc;
        border-radius: 8px;
        background-color: white;
        font-size: 1.4rem;
        padding: 1rem;
    }

    .card-back {
        transform: rotateY(180deg);
        background-color: #f0f0f0;
    }

    .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
    }

    .card-counter {
        margin-top: 0.5rem;
        font-weight: bold;
    }

    .banner {
        font-size: 1rem;
        color: #4b4b4b;
        margin-bottom: 0.5rem;
        background-color: #eee;
        padding: 6px 12px;
        border-radius: 6px;
    }
</style>
{% endblock %}

{% block content %}
<div class="practice-container">
    <h2>Practice Mode</h2>
    {% if flashcards %}
        <div class="banner">Click the card to flip 👆</div>

        <div class="flashcard" id="flashcard" onclick="flipCard()">
            <div class="card-inner" id="card-inner">
                <div class="card-front" id="card-front"></div>
                <div class="card-back" id="card-back"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-secondary" onclick="prevCard()">⬅️</button>
            <div class="card-counter" id="card-counter"></div>
            <button class="btn btn-secondary" onclick="nextCard()">➡️</button>
        </div>
        <div class="controls mt-3">
            <button class="btn btn-outline-success" onclick="markCard('mastered')">✅ Correct </button>
            <button class="btn btn-outline-warning" onclick="markCard('review')">🔁 Wrong </button>
        </div>

        <script>
            const flashcards = {{ flashcards|tojson }};
            let currentIndex = 0;

            function updateCard() {
                const card = flashcards[currentIndex];
                document.getElementById('card-front').textContent = card.front;
                document.getElementById('card-back').textContent = card.back;
                document.getElementById('card-counter').textContent = `${currentIndex + 1} / ${flashcards.length}`;
                document.getElementById('flashcard').classList.remove('flip');
            }

            function flipCard() {
                document.getElementById('flashcard').classList.toggle('flip');
            }

            function nextCard() {
                if (currentIndex < flashcards.length - 1) {
                    currentIndex++;
                    updateCard();
                }
            }

            function prevCard() {
                if (currentIndex > 0) {
                    currentIndex--;
                    updateCard();
                }
            }

            function markCard(status) {
                const card = flashcards[currentIndex];
                fetch('/update-progress', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        doc_id: card.doc_id,  //actual document ID from Firestore
                        status: status
                    })
                });
            }
            

            updateCard();  // Initial load
        </script>
    {% else %}
        <p>No flashcards found. Go back to generate some!</p>
    {% endif %}
</div>
{% endblock %}
